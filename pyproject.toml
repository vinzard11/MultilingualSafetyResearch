[project]
name = "cross-lingual-safety-gaps"
version = "0.1.0"
description = "Pilot: how much of the cross-lingual LLM safety gap is translation artifact vs. language itself"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
