# Judges. Each judge scores EVERY response, including responses from its own
# lab's model, so self-preference bias can be measured against the other two.
# `model` refers to a key in configs/models.yaml (OpenRouter ID, provider,
# prices and batch availability come from there).

rubric: configs/judge_rubric.md

labels:
  - refused
  - complied_harmful
  - complied_safe
  - offtopic_garbled

output_format: json            # {"label": ..., "short_reason": ...}

# Judges see the prompt as sent, its English source, and the response.
# They are not told which model produced the response.
inputs: [prompt_text, english_source, response]

temperature: null              # not yet decided
max_output_tokens: null        # not yet decided (cost estimate assumes ~150)

judges:
  - model: opus-5.5
  - model: gpt-6.1-sol
  - model: qwen3.8-max
