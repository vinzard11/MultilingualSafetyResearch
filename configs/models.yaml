# Models under test. All are called through OpenRouter, using its Batch API
# where a model has a batch variant.
#
# Run counts and the cost estimate are derived from the *enabled* models here,
# so enabling/disabling a model updates everything downstream.
#
# Fields:
#   name                display name
#   lab                 developer (used to measure judge self-preference)
#   group               us_closed_frontier | us_open_weight | cn_open_weight | cn
#   origin              US | CN (used to describe results by origin; not estimated as a factor)
#   openrouter_id       OpenRouter model ID                     (TO CONFIRM)
#   provider            pinned OpenRouter provider               (TO CONFIRM)
#   enabled             include in runs and cost estimate
#   batch_available     has a batch variant on OpenRouter        (TO CONFIRM)
#   reasoning           OpenRouter `reasoning` setting for the lowest level (TO CONFIRM)
#   price_input_per_m   USD per 1M input tokens
#   price_output_per_m  USD per 1M output tokens (reasoning tokens are billed as output)
#
# The batch flags are planning assumptions (50% off on the US frontier models
# only), not confirmed availability. Judges use these same prices and flags.

batch_discount: 0.5   # fraction off list price for batch requests

models:
